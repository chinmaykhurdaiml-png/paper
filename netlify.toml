[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing for Single Page Applications (SPA)
# Direct access to /shop, /about, /cart will resolve to /index.html with status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performance caching headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
